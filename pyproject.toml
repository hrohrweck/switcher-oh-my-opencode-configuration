[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-config-switcher"
dynamic = ["version"]
description = "Full-screen TUI for switching oh-my-openagent and oh-my-opencode configurations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
opencode-config-switcher = "opencode_config_switcher.cli:main"
switch-omo-config = "opencode_config_switcher.cli:main"
"switch_oh-my-opencode_config.py" = "opencode_config_switcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "opencode_config_switcher.__version__"}
